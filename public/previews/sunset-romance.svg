<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .font-cursive { font-family: 'Dancing Script', cursive, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Warm Amber Sunset Gradient -->
    <linearGradient id="sunsetBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#fef3c7"/>
      <stop offset="80%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="sunsetCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#d97706" flood-opacity="0.16"/>
    </filter>
    <filter id="sunsetBtnGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="sunsetBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="sunsetGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#fffaf0" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#sunsetBg)"/>
  <rect width="400" height="300" fill="url(#sunGlow)"/>

  <!-- Ambient Gold Confetti / Glow Points -->
  <g opacity="0.7">
    <circle cx="35" cy="45" r="2" fill="#f59e0b"/>
    <circle cx="365" cy="50" r="2.5" fill="#f59e0b"/>
    <circle cx="40" cy="245" r="2.5" fill="#d97706"/>
    <circle cx="360" cy="235" r="2" fill="#f59e0b"/>
  </g>

  <!-- Floating Emojis -->
  <text x="25" y="75" font-size="16" opacity="0.85">🌅</text>
  <text x="352" y="65" font-size="16" opacity="0.85">🧡</text>
  <text x="24" y="195" font-size="15" opacity="0.75">🥂</text>
  <text x="355" y="198" font-size="16" opacity="0.8">✨</text>
  <text x="348" y="270" font-size="15" opacity="0.8">💫</text>

  <!-- Central Card -->
  <g filter="url(#sunsetCardShadow)">
    <rect x="50" y="38" width="300" height="224" rx="20" fill="url(#sunsetGlass)" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Top Badge Pill -->
    <rect x="110" y="22" width="180" height="30" rx="15" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#sunsetCardShadow)"/>
    <text x="127" y="42" font-size="15">🌅</text>
    <text x="151" y="42" class="font-sans" font-size="9.5" font-weight="700" fill="#b45309" letter-spacing="0.5">WARM AMBER &amp; ROSE GOLD</text>

    <!-- Main Headline -->
    <text x="200" y="85" class="font-cursive" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">You Are My</text>
    <text x="200" y="118" class="font-sans" font-size="22" font-weight="800" fill="#d97706" text-anchor="middle" letter-spacing="-0.5">Golden Hour 🌅✨</text>

    <!-- Decorative Ribbon -->
    <path d="M140 133 Q 200 135 260 133" stroke="#fef3c7" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="200" cy="133.5" r="3" fill="#f59e0b"/>

    <!-- Subtitle Text -->
    <text x="200" y="154" class="font-sans" font-size="11.5" font-weight="600" fill="#92400e" text-anchor="middle">From our first hello to forever &amp; beyond</text>
    <text x="200" y="171" class="font-sans" font-size="10" font-weight="500" fill="#b45309" text-anchor="middle" opacity="0.85">My sun, my moon &amp; all my stars...</text>

    <!-- Action Button -->
    <g transform="translate(125, 192)" filter="url(#sunsetBtnGlow)">
      <rect width="150" height="38" rx="19" fill="url(#sunsetBtn)"/>
      <rect x="2" y="2" width="146" height="17" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="75" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Open Keepsake 🌅</text>
    </g>
  </g>
</svg>
