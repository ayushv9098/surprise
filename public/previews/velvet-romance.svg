<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .font-cursive { font-family: 'Dancing Script', cursive, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Deep Velvet Rose Gradient -->
    <linearGradient id="velvetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#2a0410"/>
    </linearGradient>

    <radialGradient id="velvetGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="velvetCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="velvetBtnGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.6"/>
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="velvetBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="velvetGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#fff1f2" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#velvetBg)"/>
  <rect width="400" height="300" fill="url(#velvetGlow)"/>

  <!-- Floating Petals & Hearts -->
  <g opacity="0.65">
    <path d="M 32 42 C 38 34, 48 37, 45 47 C 41 54, 30 50, 32 42 Z" fill="#fb7185"/>
    <path d="M 368 70 C 375 63, 383 67, 381 75 C 377 81, 368 77, 368 70 Z" fill="#fda4af"/>
    <path d="M 45 240 C 50 232, 60 235, 57 245 C 53 252, 43 248, 45 240 Z" fill="#f43f5e"/>
    <path d="M 355 245 C 361 239, 369 243, 367 250 C 363 255, 355 251, 355 245 Z" fill="#fb7185"/>
  </g>

  <!-- Floating Emojis -->
  <text x="30" y="75" font-size="16" opacity="0.85">❤️</text>
  <text x="355" y="45" font-size="16" opacity="0.85">🌹</text>
  <text x="360" y="195" font-size="16" opacity="0.8">💍</text>
  <text x="24" y="195" font-size="15" opacity="0.75">✨</text>
  <text x="348" y="270" font-size="15" opacity="0.8">💌</text>

  <!-- Central Luxury Velvet Card -->
  <g filter="url(#velvetCardShadow)">
    <rect x="50" y="38" width="300" height="224" rx="20" fill="url(#velvetGlass)" stroke="#fecdd3" stroke-width="1.5"/>

    <!-- Top Badge Pill -->
    <rect x="115" y="22" width="170" height="30" rx="15" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5" filter="url(#velvetCardShadow)"/>
    <text x="133" y="42" font-size="15">❤️</text>
    <text x="156" y="42" class="font-sans" font-size="10" font-weight="700" fill="#be123c" letter-spacing="0.5">VELVET CRIMSON &amp; HEARTS</text>

    <!-- Headline -->
    <text x="200" y="85" class="font-cursive" font-size="28" font-weight="700" fill="#881337" text-anchor="middle">Happy Anniversary,</text>
    <text x="200" y="118" class="font-sans" font-size="23" font-weight="800" fill="#e11d48" text-anchor="middle" letter-spacing="-0.5">My Love! ❤️🌹</text>

    <!-- Decorative Rose Ribbon / Divider -->
    <path d="M140 133 Q 200 135 260 133" stroke="#ffe4e6" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="200" cy="133.5" r="3" fill="#e11d48"/>

    <!-- Subtitle Text -->
    <text x="200" y="154" class="font-sans" font-size="11.5" font-weight="600" fill="#9f1239" text-anchor="middle">Every second with you is my favorite memory</text>
    <text x="200" y="171" class="font-sans" font-size="10" font-weight="500" fill="#be123c" text-anchor="middle" opacity="0.85">A sealed keepsake crafted for forever &amp; always...</text>

    <!-- Action Button -->
    <g transform="translate(125, 192)" filter="url(#velvetBtnGlow)">
      <rect width="150" height="38" rx="19" fill="url(#velvetBtn)"/>
      <rect x="2" y="2" width="146" height="17" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="75" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Unseal Love ❤️</text>
    </g>
  </g>
</svg>
