<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .font-cursive { font-family: 'Dancing Script', cursive, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Gentle Olive & Peace Serenity Gradient -->
    <linearGradient id="peaceBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="45%" stop-color="#dcfce7"/>
      <stop offset="85%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>

    <radialGradient id="peaceGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="peaceCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14532d" flood-opacity="0.16"/>
    </filter>
    <filter id="peaceBtnGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#15803d" flood-opacity="0.45"/>
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="peaceBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="peaceGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f7fee7" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#peaceBg)"/>
  <rect width="400" height="300" fill="url(#peaceGlow)"/>

  <!-- Olive Leaves / Soft Sprigs -->
  <g opacity="0.6">
    <circle cx="35" cy="45" r="2" fill="#15803d"/>
    <circle cx="365" cy="50" r="2" fill="#16a34a"/>
    <circle cx="40" cy="245" r="2" fill="#15803d"/>
    <circle cx="360" cy="235" r="2" fill="#16a34a"/>
  </g>

  <!-- Floating Emojis -->
  <text x="25" y="70" font-size="16" opacity="0.85">🕊️</text>
  <text x="355" y="60" font-size="16" opacity="0.85">🤍</text>
  <text x="24" y="200" font-size="15" opacity="0.75">🌿</text>
  <text x="355" y="200" font-size="16" opacity="0.8">🌸</text>
  <text x="348" y="265" font-size="15" opacity="0.8">🕊️</text>

  <!-- Central Card -->
  <g filter="url(#peaceCardShadow)">
    <rect x="50" y="38" width="300" height="224" rx="20" fill="url(#peaceGlass)" stroke="#bbf7d0" stroke-width="1.5"/>

    <!-- Top Badge Pill -->
    <rect x="110" y="22" width="180" height="30" rx="15" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#peaceCardShadow)"/>
    <text x="127" y="42" font-size="15">🕊️</text>
    <text x="151" y="42" class="font-sans" font-size="9.5" font-weight="700" fill="#166534" letter-spacing="0.5">GENTLE OLIVE &amp; WHITE PEACE</text>

    <!-- Main Headline -->
    <text x="200" y="85" class="font-cursive" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Can We Make Up?</text>
    <text x="200" y="118" class="font-sans" font-size="21" font-weight="800" fill="#15803d" text-anchor="middle" letter-spacing="-0.5">Truly Sorry 🕊️🤍</text>

    <!-- Decorative Ribbon -->
    <path d="M140 133 Q 200 135 260 133" stroke="#dcfce7" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="200" cy="133.5" r="3" fill="#15803d"/>

    <!-- Subtitle Text -->
    <text x="200" y="154" class="font-sans" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">I made a mistake, your happiness is everything</text>
    <text x="200" y="171" class="font-sans" font-size="10" font-weight="500" fill="#15803d" text-anchor="middle" opacity="0.85">Our bond means everything to me...</text>

    <!-- Action Button -->
    <g transform="translate(125, 192)" filter="url(#peaceBtnGlow)">
      <rect width="150" height="38" rx="19" fill="url(#peaceBtn)"/>
      <rect x="2" y="2" width="146" height="17" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="75" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Read Peace Note 🕊️</text>
    </g>
  </g>
</svg>
