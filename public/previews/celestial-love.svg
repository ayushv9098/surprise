<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .font-cursive { font-family: 'Dancing Script', cursive, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Midnight Indigo Gradient -->
    <linearGradient id="indigoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <radialGradient id="indigoGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="celestialCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    <filter id="celestialBtnGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.6"/>
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="indigoBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="indigoGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#indigoBg)"/>
  <rect width="400" height="300" fill="url(#indigoGlow)"/>

  <!-- Star Constellations / Tiny Dots -->
  <g opacity="0.75">
    <circle cx="35" cy="40" r="1.5" fill="#a5b4fc"/>
    <circle cx="80" cy="25" r="1" fill="#e0e7ff"/>
    <circle cx="360" cy="45" r="1.5" fill="#c7d2fe"/>
    <circle cx="340" cy="85" r="1.2" fill="#e0e7ff"/>
    <circle cx="45" cy="245" r="1.2" fill="#a5b4fc"/>
    <circle cx="365" cy="240" r="1.8" fill="#c7d2fe"/>
    <line x1="35" y1="40" x2="80" y2="25" stroke="#6366f1" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.4"/>
    <line x1="340" y1="85" x2="360" y2="45" stroke="#6366f1" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.4"/>
  </g>

  <!-- Floating Emojis -->
  <text x="25" y="70" font-size="16" opacity="0.85">🌌</text>
  <text x="355" y="55" font-size="16" opacity="0.85">🌙</text>
  <text x="26" y="195" font-size="15" opacity="0.75">⭐</text>
  <text x="355" y="195" font-size="16" opacity="0.8">💫</text>
  <text x="348" y="270" font-size="15" opacity="0.8">🪐</text>

  <!-- Central Card -->
  <g filter="url(#celestialCardShadow)">
    <rect x="50" y="38" width="300" height="224" rx="20" fill="url(#indigoGlass)" stroke="#c7d2fe" stroke-width="1.5"/>

    <!-- Top Badge Pill -->
    <rect x="110" y="22" width="180" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#celestialCardShadow)"/>
    <text x="127" y="42" font-size="15">🌌</text>
    <text x="151" y="42" class="font-sans" font-size="9.5" font-weight="700" fill="#4338ca" letter-spacing="0.5">MIDNIGHT STARS &amp; STARLIGHT</text>

    <!-- Main Headline -->
    <text x="200" y="85" class="font-cursive" font-size="28" font-weight="700" fill="#1e1b4b" text-anchor="middle">Written in the</text>
    <text x="200" y="118" class="font-sans" font-size="23" font-weight="800" fill="#4f46e5" text-anchor="middle" letter-spacing="-0.5">Stars 🌌💫</text>

    <!-- Decorative Divider -->
    <path d="M140 133 Q 200 135 260 133" stroke="#e0e7ff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="200" cy="133.5" r="3" fill="#4f46e5"/>

    <!-- Subtitle Text -->
    <text x="200" y="154" class="font-sans" font-size="11.5" font-weight="600" fill="#312e81" text-anchor="middle">In eight billion souls, it was always you</text>
    <text x="200" y="171" class="font-sans" font-size="10" font-weight="500" fill="#4338ca" text-anchor="middle" opacity="0.85">Our love across the infinite cosmos...</text>

    <!-- Action Button -->
    <g transform="translate(125, 192)" filter="url(#celestialBtnGlow)">
      <rect width="150" height="38" rx="19" fill="url(#indigoBtn)"/>
      <rect x="2" y="2" width="146" height="17" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="75" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Explore Stars 🌌</text>
    </g>
  </g>
</svg>
