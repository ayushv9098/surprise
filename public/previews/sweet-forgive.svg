<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .font-cursive { font-family: 'Dancing Script', cursive, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Pastel Lilac Gradient -->
    <linearGradient id="forgiveBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="45%" stop-color="#f3e8ff"/>
      <stop offset="85%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <radialGradient id="forgiveGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="forgiveCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6b21a8" flood-opacity="0.16"/>
    </filter>
    <filter id="forgiveBtnGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.45"/>
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="forgiveBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="forgiveGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#faf5ff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#forgiveBg)"/>
  <rect width="400" height="300" fill="url(#forgiveGlow)"/>

  <!-- Floating Warm Lilac Dots -->
  <g opacity="0.6">
    <circle cx="35" cy="45" r="2" fill="#8b5cf6"/>
    <circle cx="365" cy="50" r="2" fill="#a855f7"/>
    <circle cx="40" cy="245" r="2" fill="#8b5cf6"/>
    <circle cx="360" cy="235" r="2" fill="#a855f7"/>
  </g>

  <!-- Floating Emojis -->
  <text x="25" y="70" font-size="16" opacity="0.85">🥺</text>
  <text x="355" y="60" font-size="16" opacity="0.85">💜</text>
  <text x="24" y="200" font-size="15" opacity="0.75">🧸</text>
  <text x="355" y="200" font-size="16" opacity="0.8">🌸</text>
  <text x="348" y="265" font-size="15" opacity="0.8">💌</text>

  <!-- Central Card -->
  <g filter="url(#forgiveCardShadow)">
    <rect x="50" y="38" width="300" height="224" rx="20" fill="url(#forgiveGlass)" stroke="#e9d5ff" stroke-width="1.5"/>

    <!-- Top Badge Pill -->
    <rect x="110" y="22" width="180" height="30" rx="15" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#forgiveCardShadow)"/>
    <text x="127" y="42" font-size="15">🥺</text>
    <text x="151" y="42" class="font-sans" font-size="9.5" font-weight="700" fill="#6b21a8" letter-spacing="0.5">PASTEL LILAC &amp; BIG HUGS</text>

    <!-- Main Headline -->
    <text x="200" y="85" class="font-cursive" font-size="28" font-weight="700" fill="#581c87" text-anchor="middle">Forgive Me Please?</text>
    <text x="200" y="118" class="font-sans" font-size="21" font-weight="800" fill="#8b5cf6" text-anchor="middle" letter-spacing="-0.5">Infinite Hugs 🥺💜</text>

    <!-- Decorative Ribbon -->
    <path d="M140 133 Q 200 135 260 133" stroke="#f3e8ff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="200" cy="133.5" r="3" fill="#8b5cf6"/>

    <!-- Subtitle Text -->
    <text x="200" y="154" class="font-sans" font-size="11.5" font-weight="600" fill="#6b21a8" text-anchor="middle">I miss your smile so much. Let's make it right</text>
    <text x="200" y="171" class="font-sans" font-size="10" font-weight="500" fill="#7c3aed" text-anchor="middle" opacity="0.85">Infinite hugs &amp; a truly sorry heart...</text>

    <!-- Action Button -->
    <g transform="translate(125, 192)" filter="url(#forgiveBtnGlow)">
      <rect width="150" height="38" rx="19" fill="url(#forgiveBtn)"/>
      <rect x="2" y="2" width="146" height="17" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="75" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Send Hugs 🥺💜</text>
    </g>
  </g>
</svg>
