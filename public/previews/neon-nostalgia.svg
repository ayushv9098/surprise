<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .font-cursive { font-family: 'Dancing Script', cursive, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>

    <!-- Electric Teal & Dark Slate Gradient -->
    <linearGradient id="neonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="neonGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="neonCardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.6"/>
    </filter>
    <filter id="neonBtnGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.6"/>
    </filter>

    <!-- Button Gradient -->
    <linearGradient id="neonBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="neonGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f0fdfa" stop-opacity="0.94"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" fill="url(#neonBg)"/>
  <rect width="400" height="300" fill="url(#neonGlow)"/>

  <!-- Electric Sparkles / Lightning lines -->
  <g opacity="0.6">
    <circle cx="35" cy="40" r="1.5" fill="#5eead4"/>
    <circle cx="365" cy="50" r="2" fill="#5eead4"/>
    <circle cx="45" cy="245" r="1.5" fill="#2dd4bf"/>
    <circle cx="360" cy="240" r="2" fill="#5eead4"/>
  </g>

  <!-- Floating Emojis -->
  <text x="25" y="75" font-size="16" opacity="0.85">⚡</text>
  <text x="355" y="55" font-size="16" opacity="0.85">🤙</text>
  <text x="25" y="195" font-size="15" opacity="0.75">🔥</text>
  <text x="355" y="195" font-size="16" opacity="0.8">🛹</text>
  <text x="348" y="270" font-size="15" opacity="0.8">🎒</text>

  <!-- Central Card -->
  <g filter="url(#neonCardShadow)">
    <rect x="50" y="38" width="300" height="224" rx="20" fill="url(#neonGlass)" stroke="#99f6e4" stroke-width="1.5"/>

    <!-- Top Badge Pill -->
    <rect x="110" y="22" width="180" height="30" rx="15" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" filter="url(#neonCardShadow)"/>
    <text x="127" y="42" font-size="15">⚡</text>
    <text x="151" y="42" class="font-sans" font-size="9.5" font-weight="700" fill="#0f766e" letter-spacing="0.5">ELECTRIC TEAL &amp; BROTHERHOOD</text>

    <!-- Main Headline -->
    <text x="200" y="85" class="font-cursive" font-size="28" font-weight="700" fill="#134e4a" text-anchor="middle">Brothers &amp; Partners</text>
    <text x="200" y="118" class="font-sans" font-size="22" font-weight="800" fill="#0d9488" text-anchor="middle" letter-spacing="-0.5">in Crime ⚡🔥</text>

    <!-- Decorative Divider -->
    <path d="M140 133 Q 200 135 260 133" stroke="#ccfbf1" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="200" cy="133.5" r="3" fill="#0d9488"/>

    <!-- Subtitle Text -->
    <text x="200" y="154" class="font-sans" font-size="11.5" font-weight="600" fill="#115e59" text-anchor="middle">To crazy stories &amp; legendary adventures</text>
    <text x="200" y="171" class="font-sans" font-size="10" font-weight="500" fill="#0f766e" text-anchor="middle" opacity="0.85">Unstoppable energy &amp; brotherhood...</text>

    <!-- Action Button -->
    <g transform="translate(125, 192)" filter="url(#neonBtnGlow)">
      <rect width="150" height="38" rx="19" fill="url(#neonBtn)"/>
      <rect x="2" y="2" width="146" height="17" rx="9" fill="#ffffff" opacity="0.2"/>
      <text x="75" y="24" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Unleash Energy ⚡</text>
    </g>
  </g>
</svg>
